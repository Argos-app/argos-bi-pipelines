# Gold: sete lotes de ate cinco tasks; cada lote aguarda todo o anterior.
bundle:
  name: argos-medallion
variables:
  catalog:
    default: main
  source_schema:
    default: public
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: self_service
  jdbc_url:
    description: URL JDBC PostgreSQL (usuário e senha definidos no notebook Bronze)
    default: jdbc:postgresql://banco-de-dados-institutojef-6ce7.c.aivencloud.com:24330/defaultdb?sslmode=require
resources:
  jobs:
    argos_medallion:
      name: argos-bronze-silver-self-service
      max_concurrent_runs: 1
      parameters:
      - name: force_snapshot
        default: 'false'
      - name: lookback_hours
        default: '24'
      tasks:
      - task_key: bronze
        notebook_task:
          notebook_path: ./notebooks/01_bronze.py
          base_parameters:
            catalog: ${var.catalog}
            source_schema: ${var.source_schema}
            bronze_schema: ${var.bronze_schema}
            silver_schema: ${var.silver_schema}
            gold_schema: ${var.gold_schema}
            jdbc_url: ${var.jdbc_url}
            lookback_hours: '{{job.parameters.lookback_hours}}'
            force_snapshot: '{{job.parameters.force_snapshot}}'
        max_retries: 2
        min_retry_interval_millis: 60000
      - task_key: silver
        depends_on:
        - task_key: bronze
        notebook_task:
          notebook_path: ./notebooks/02_silver.py
          base_parameters:
            catalog: ${var.catalog}
            source_schema: ${var.source_schema}
            bronze_schema: ${var.bronze_schema}
            silver_schema: ${var.silver_schema}
            gold_schema: ${var.gold_schema}
      - task_key: gold__context_user_property
        depends_on:
        - task_key: silver
        run_if: ALL_SUCCESS
        notebook_task:
          notebook_path: ./notebooks/gold/_context_user_property.py
          base_parameters:
            catalog: ${var.catalog}
            source_schema: ${var.source_schema}
            bronze_schema: ${var.bronze_schema}
            silver_schema: ${var.silver_schema}
            gold_schema: ${var.gold_schema}
      - task_key: gold__context_medicine
        depends_on:
        - task_key: silver
        run_if: ALL_SUCCESS
        notebook_task:
          notebook_path: ./notebooks/gold/_context_medicine.py
          base_parameters:
            catalog: ${var.catalog}
            source_schema: ${var.source_schema}
            bronze_schema: ${var.bronze_schema}
            silver_schema: ${var.silver_schema}
            gold_schema: ${var.gold_schema}
      - task_key: gold__context_medicine_batch
        depends_on:
        - task_key: silver
        run_if: ALL_SUCCESS
        notebook_task:
          notebook_path: ./notebooks/gold/_context_medicine_batch.py
          base_parameters:
            catalog: ${var.catalog}
            source_schema: ${var.source_schema}
            bronze_schema: ${var.bronze_schema}
            silver_schema: ${var.silver_schema}
