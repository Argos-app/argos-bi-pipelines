bundle:
  name: argos-ai-bi
resources:
  jobs:
    argos_ai_medallion:
      name: argos-ai-bi
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: "workspace"
        - name: bronze_schema
          default: "bronze_ia"
        - name: silver_schema
          default: "silver_ia"
        - name: gold_schema
          default: "gold_ia"
        - name: source_database
          default: "argos_ai"
        - name: source_a2a_database
          default: ""
        - name: collections_json
          default: "{}"
        - name: jsonl_path
          default: "/Volumes/workspace/bronze_ia/landing/atual"
        - name: project_root
          default: "${workspace.file_path}"
        - name: page_size
          default: "500"
        - name: max_documents_per_source
          default: "1000000"
        - name: max_page_bytes
          default: "16777216"
        - name: max_cycle_depth
          default: "100"
        - name: fail_on_quarantine
          default: "true"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: g_interactions
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold/g_interactions.py
        - task_key: g_observations
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold/g_observations.py
        - task_key: g_invocations
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold/g_invocations.py
        - task_key: g_email_dispatches
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold/g_email_dispatches.py
        - task_key: validar
          depends_on:
            - task_key: g_interactions
            - task_key: g_observations
            - task_key: g_invocations
            - task_key: g_email_dispatches
          notebook_task:
            notebook_path: ./notebooks/04_validacao.py
targets:
  dev:
    default: true
    mode: development
